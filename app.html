const M=v=>String(v).replace('.',',');
function renderAlgo(){
  const el=document.getElementById('v-algo');
  if(!sim)sim={c:null,t:0};
  const ret=db.settings.retention,c=sim.c,h=c?c.h:[];
  el.innerHTML=`
    <div class="prose">
      <p class="eyebrow">FSRS-6 · Free Spaced Repetition Scheduler</p>
      <h2>Drei Zahlen pro Karte</h2>
      <p>Jede Karte (Wort × Richtung) trägt einen Zustand aus drei Größen. Daraus berechnet das Modell, wann die nächste Abfrage sinnvoll ist.</p>
      <dl class="kv" style="font-size:14px;gap:6px 16px">
        <dt><b>R</b> Abrufwahrscheinlichkeit</dt><dd style="font-family:var(--f-body)">Wahrscheinlichkeit, das Wort jetzt richtig zu wissen. Sinkt mit der Zeit.</dd>
        <dt><b>S</b> Stabilität</dt><dd style="font-family:var(--f-body)">Tage, bis R auf 90 % gefallen ist. Das ist ein fester Bezugswert des Modells, unabhängig von deinem Ziel. Wächst mit jeder erfolgreichen Wiederholung.</dd>
        <dt><b>D</b> Schwierigkeit</dt><dd style="font-family:var(--f-body)">1 bis 10. Bremst das Wachstum von S bei Wörtern, die dir schwerfallen.</dd>
      </dl>
      <div class="mathcards">
        <div class="mathcard">
          <h4>Vergessenskurve: Wie wahrscheinlich weiß ich das Wort noch?</h4>
          <div class="mathbox"><math display="block"><mi>R</mi><mo stretchy="false">(</mo><mi>t</mi><mo>,</mo><mi>S</mi><mo stretchy="false">)</mo><mo>=</mo><msup><mrow><mo>(</mo><mn>1</mn><mo>+</mo><mi>f</mi><mo>·</mo><mfrac><mi>t</mi><mi>S</mi></mfrac><mo>)</mo></mrow><mrow><mo>−</mo><mn>${M(W[20])}</mn></mrow></msup></math></div>
          <div class="mathbox"><math display="block"><mi>f</mi><mo>=</mo><msup><mn>0,9</mn><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mn>${M(W[20])}</mn></mrow></msup><mo>−</mo><mn>1</mn><mo>≈</mo><mn>${nf(FACTOR,3)}</mn></math></div>
          <p><i>t</i> = Tage seit der letzten Wiederholung, <i>S</i> = Stabilität in Tagen. <i>f</i> ist so gewählt, dass nach genau <i>S</i> Tagen noch 90 % übrig sind.</p>
        </div>
        <div class="mathcard">
          <h4>Nächste Abfrage: nach wie vielen Tagen?</h4>
          <div class="mathbox"><math display="block"><mi>I</mi><mo>=</mo><mfrac><mi>S</mi><mi>f</mi></mfrac><mo>·</mo><mrow><mo>(</mo><msup><mi>r</mi><mrow><mo>−</mo><mn>1</mn><mo>/</mo><mn>${M(W[20])}</mn></mrow></msup><mo>−</mo><mn>1</mn><mo>)</mo></mrow></math></div>
          <p><i>r</i> = deine Zielbehaltensrate, aktuell <b>${Math.round(ret*100)} %</b>. ${Math.round(ret*100)===90?'Damit ist das Intervall genau die Stabilität: <i>I</i> = <i>S</i>.':`Damit ist <i>I</i> ≈ ${nf(FSRS.interval(1,ret),2)} · <i>S</i>. Ein Wort, das 10 Tage sitzt, kommt also nach ${fmtIvl(FSRS.interval(10,ret)*DAY)} wieder (bei 90 % wären es 10 Tage).`}</p>
        </div>
        <div class="mathcard">
          <h4>Richtig beantwortet: Stabilität wächst</h4>
          <div class="mathbox"><math display="block"><msup><mi>S</mi><mo>′</mo></msup><mo>=</mo><mi>S</mi><mo>·</mo><mo stretchy="false">(</mo><mn>1</mn><mo>+</mo><mi>Δ</mi><mo stretchy="false">)</mo></math></div>
          <div class="mathbox"><math display="block"><mi>Δ</mi><mo>=</mo><msup><mi>e</mi><mn>${M(W[8])}</mn></msup><mo>·</mo><mo stretchy="false">(</mo><mn>11</mn><mo>−</mo><mi>D</mi><mo stretchy="false">)</mo><mo>·</mo><msup><mi>S</mi><mrow><mo>−</mo><mn>${M(W[9])}</mn></mrow></msup><mo>·</mo><mi>g</mi><mo>·</mo><mi>b</mi></math></div>
          <div class="mathbox"><math display="block"><mi>g</mi><mo>=</mo><msup><mi>e</mi><mrow><mn>${M(W[10])}</mn><mo>·</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>R</mi><mo stretchy="false">)</mo></mrow></msup><mo>−</mo><mn>1</mn></math></div>
          <p><i>D</i> = Schwierigkeit (1–10), <i>R</i> = Abrufwahrscheinlichkeit kurz vor der Antwort, <i>b</i> = ${M(W[15])} bei „Schwer“, ${M(W[16])} bei „Leicht“, sonst 1. <i>g</i> wird umso größer, je niedriger <i>R</i> war. Der Zuwachs ist also groß, wenn du das Wort fast vergessen hattest, <i>S</i> noch klein ist und das Wort leicht ist.</p>
        </div>
        <div class="mathcard">
          <h4>Falsch beantwortet: Stabilität fällt</h4>
          <div class="mathbox"><math display="block"><msup><mi>S</mi><mo>′</mo></msup><mo>=</mo><mn>${M(W[11])}</mn><mo>·</mo><msup><mi>D</mi><mrow><mo>−</mo><mn>${M(W[12])}</mn></mrow></msup><mo>·</mo><mi>h</mi><mo>·</mo><msup><mi>e</mi><mrow><mn>${M(W[14])}</mn><mo>·</mo><mo stretchy="false">(</mo><mn>1</mn><mo>−</mo><mi>R</mi><mo stretchy="false">)</mo></mrow></msup></math></div>
          <div class="mathbox"><math display="block"><mi>h</mi><mo>=</mo><msup><mrow><mo stretchy="false">(</mo><mi>S</mi><mo>+</mo><mn>1</mn><mo stretchy="false">)</mo></mrow><mn>${M(W[13])}</mn></msup><mo>−</mo><mn>1</mn></math></div>
          <p><i>h</i> wächst mit der bisherigen Stabilität <i>S</i>. Nach einem Fehler beginnt das Wort also nicht bei null: Wer es vorher lange wusste (großes <i>S</i>), behält einen Teil der Stabilität.</p>
        </div>
      </div>
      <p>Für Datenleute lesbar: Der Stabilitätsgewinn ist umso größer, je <b>niedriger R</b> zum Zeitpunkt der Wiederholung war (schwer erkämpftes Erinnern zählt mehr), je <b>kleiner S</b> schon ist (abnehmender Grenznutzen) und je <b>leichter</b> das Wort ist. Die 21 Gewichte stammen aus Fits auf Hunderten Millionen Anki-Wiederholungen und lassen sich später auf die eigenen Daten nachoptimieren.</p>
      <p><b>Bewertung im Multiple-Choice-Test:</b> Die App fragt nicht nach, sondern leitet die Bewertung aus der Reaktionszeit ab. Bereinigt wird um die Position der Antwort (deine typische Zeit je Position) und um die Länge von Begriff und Antwort (aktuell ${nf(posModel().lenSlope)} ms pro Zeichen${posModel().lenFitted?', aus deinen Daten':', Standardwert'}). Mit der bereinigten Zeit gilt: falsch ergibt „Nochmal“, richtig über ${secs(posModel().slow)} „Schwer“, ${secs(posModel().fast)}–${secs(posModel().slow)} „Gut“, unter ${secs(posModel().fast)} „Leicht“. Woher diese Grenzen kommen, steht unten bei „Trefferquote nach Reaktionszeit“. Beim allerersten Sehen eines Wortes gibt es höchstens „Gut“, weil ein schneller Treffer dort auch Glück sein kann. Passt die Bewertung nicht zu deinem Gefühl, tippe oben in der Zeile „Zuletzt“ auf „ändern“ und wähle geraten, schwer, gut oder leicht. Die Antwortzeit der gerade gezeigten Karte beginnt danach neu. „Weiß nicht“ unter den Antworten zählt wie eine falsche Antwort, damit geratene Treffer nicht als gewusst gelten. Die Zeit dieser Antworten fließt nicht in die Statistik ein.</p>
      <p><b>Vertipper:</b> Ist eine falsche Antwort bei einem schon bekannten Wort schneller als ${secs(posModel().slip)} (deine schnellsten 25 % der richtigen Antworten${posModel().slipFitted?'':', bis genug Daten da sind: Standardwert'}), gilt sie als vertippt. Sie zählt nicht, das Wort kommt nach drei Karten noch einmal, und diese Antwort entscheidet. Langsame Fehler zählen voll.</p>
      <p><b>Schwierigkeit 0–100</b> (Wörter-Tabelle, Sorgenkinder): zu 70 % aus deiner bereinigten Reaktionszeit für das Wort (Median der letzten 8 richtigen Antworten, verglichen mit deinen anderen Wörtern), zu 30 % aus echten Fehlern. Bei wenigen Antworten wird zur Mitte hin gedämpft. 0 heißt: leichter als alle deine anderen Wörter, 100: schwerer.</p>
    </div>
    ${posPanel()}
    <div class="panel chart">
      <div class="row" style="justify-content:space-between"><h3>Simulator: eine Karte durchspielen</h3><button class="btn small ghost" data-sim="reset">Neu starten</button></div>
      <p class="cap">Bewerte die Karte mehrmals hintereinander. Jede Wiederholung findet zum gewählten Zeitpunkt statt. Probiere „zu spät“ aus: R ist dann niedriger und der Stabilitätssprung größer.</p>
      <div class="row">
        <div class="seg" role="group" aria-label="Zeitpunkt">${[['early','zu früh (½ Intervall)'],['due','planmäßig'],['late','zu spät (3× Intervall)']].map(([v,l])=>`<button data-simt="${v}" aria-pressed="${simTiming===v}">${l}</button>`).join('')}</div>
        <div class="row" style="gap:6px">${[1,2,3,4].map(g=>`<button class="btn small" data-sim="${g}"><span class="pill g${g}">${GRADES[g]}</span></button>`).join('')}</div>
      </div>
      ${h.length?curveSvg([{h,cls:'c0'}],{ret}):'<p class="muted">Klicke eine Bewertung, um die erste Abfrage zu simulieren.</p>'}
      ${h.length?gradeLegend():''}
      ${h.length?`<div class="tablewrap"><table><thead><tr><th class="num">#</th><th class="num">Tag</th><th>Bewertung</th><th class="num">R vorher</th><th class="num">S danach</th><th class="num">D danach</th><th class="num">nächstes Intervall</th></tr></thead><tbody>${h.map((e,i)=>`<tr><td class="num">${i+1}</td><td class="num">${nf((e[0]-h[0][0])/DAY,1)}</td><td><span class="pill g${e[1]}">${GRADES[e[1]]}</span></td><td class="num">${e[2]<0?'–':pct(e[2])}</td><td class="num">${fmtS(e[3])}</td><td class="num">${nf(e[4],2)}</td><td class="num">${e[1]===1?'10 Min':fmtIvl(Math.max(1,Math.round(FSRS.interval(e[3],ret)))*DAY)}</td></tr>`).join('')}</tbody></table></div>`:''}
    </div>
    <div class="panel"><h3 style="margin-bottom:10px">Warum FSRS und nicht Leitner oder SM-2?</h3>
      <div class="tablewrap" style="border:0"><table class="cmp"><thead><tr><th>Verfahren</th><th>Modell</th><th>Stärke</th><th>Schwäche</th></tr></thead><tbody>
        <tr><td><b>Leitner-Kasten</b></td><td>5 Fächer mit festen Intervallen</td><td>sofort verständlich, Fächer lassen sich gut zeigen</td><td>kein Wahrscheinlichkeitsmodell; jedes Wort im gleichen Fach wird gleich behandelt</td></tr>
        <tr><td><b>SM-2</b> (Anki bis 2023)</td><td>Intervall × Ease-Faktor</td><td>einfach, seit 1987 erprobt</td><td>Heuristik ohne Vorhersage; „Ease Hell“ bei häufigen Fehlern</td></tr>
        <tr><td><b>HLR</b> (Duolingo)</td><td>Halbwertszeit per Regression</td><td>sauberes statistisches Modell</td><td>braucht Feature-Engineering und viele Daten</td></tr>
        <tr><td><b>FSRS-6</b> (Anki-Standard)</td><td>Vergessenskurve mit S, D, R</td><td>liefert R als echte Wahrscheinlichkeit; in Benchmarks am treffsichersten; spart 20–30 % Wiederholungen bei gleicher Behaltensrate</td><td>21 Parameter; die Formeln brauchen eine Erklärung, wie diese hier</td></tr>
      </tbody></table></div>
    </div>`;
}
function posPanel(){
  const pm=posModel();
  const data=pm.meds.map((m,i)=>({label:'Pos. '+(i+1),title:`Position ${i+1} (${pm.counts[i]} richtige Antworten)`,parts:[{v:m||0,cls:'bar',name:'ms Median'}]}));
  return`<div class="panel chart"><h3>Antwortzeit nach Position</h3>
    <p class="cap">Median der Antwortzeit (ms) deiner richtigen Antworten je Listenposition. ${pm.fitted?`Jede Position wird an ihrem eigenen Median gemessen: Die Differenz zum Gesamtmedian (${nf(pm.ref)} ms) wird abgezogen bzw. dazugerechnet. Aktuell: ${pm.offset.map((o,i)=>`Pos. ${i+1} ${Math.abs(o)<50?'±0':(o>0?'−':'+')+nf(Math.abs(o)/1000,1)+' s'}`).join(' · ')}. Grundlage: ${nf(pm.n)} richtige Antworten.`:`Bis je Position mindestens 5 und insgesamt 40 richtige Antworten vorliegen (bisher ${nf(pm.n)}), gilt ein Standard: 0,4 s Abzug pro Position weiter unten.`}</p>
    ${pm.n?barChart(data):'<p class="muted">Noch keine gemessenen Antworten.</p>'}</div>
  <div class="panel chart"><h3>Trefferquote nach Reaktionszeit</h3>
    <p class="cap">Wie oft du richtig liegst, je nachdem wie schnell du antwortest (Zeit bereinigt um die Position). Daraus kommen die Grenzen: <b>Leicht</b> reicht bis zu dem Tempo, ab dem deine Trefferquote unter ${Math.round(EASY_ACC*100)} % fällt. <b>Schwer</b> beginnt, wo sie unter ${Math.round(HARD_ACC*100)} % fällt. Gemessen wird die Quote jeweils über die benachbarten Antworten mit ähnlicher Zeit (gleitender Durchschnitt).</p>
    <p style="font-size:14px">${pm.timeFitted?`Aus deinen ${nf(pm.nAll)} Antworten (${nf(pm.wrong)} falsch): <b>Leicht unter ${secs(pm.fast)}</b>, <b>Schwer über ${secs(pm.slow)}</b>.`:`Noch Standardwerte (Leicht unter ${secs(FAST_MS)}, Schwer über ${secs(SLOW_MS)}). Eigene Grenzen ab ${TIME_MIN_N} Antworten, davon ${TIME_MIN_WRONG} falsche (bisher ${nf(pm.nAll)}, davon ${nf(pm.wrong)} falsch).`}</p>
    ${pm.nAll?`<div class="rbars">${pm.curve.filter(b=>b.n).map(b=>`<div class="rbrow"><div><b>${b.b===Infinity?'über '+secs(b.a):secs(b.a).replace(' s','')+'–'+secs(b.b)}</b><span>${nf(b.n)} Antworten</span></div><div class="rbtrack"><i style="width:${b.acc*100}%;background:var(${b.acc>=EASY_ACC?'--s-solid':b.acc>=HARD_ACC?'--s-shaky':'--s-learning'})"></i></div><b class="rbn">${pct(b.acc)}</b></div>`).join('')}</div>`:''}
  </div>`;
}
function simStep(g){
  const ret=db.settings.retention;let t=0;
  if(sim.c){const ivl=sim.c.lastG===1?10*MIN:Math.max(1,Math.round(FSRS.interval(sim.c.S,ret)))*DAY;t=sim.c.last+ivl*(simTiming==='early'?0.5:simTiming==='late'?3:1)}
  sim.c=applyReview(sim.c,g,t,ret);renderAlgo();
}

/* ===================== Navigation & Ereignisse ===================== */
function renderDeckSel(){
  wordLenCache=null;posCache=null;
  const s=document.getElementById('deckSel');if(!s)return;   // Deckwahl läuft über das Logo oben links
  s.innerHTML=db.decks.map(d=>`<option value="${d.id}"${d.id===db.active?' selected':''}>${esc(deckLabel(d))} (${d.words.length})</option>`).join('')||'<option>kein Deck</option>';
}
function show(v){
  if(v!=='learn')clearTimeout(autoTimer);
  // eine noch offene Karte startet ihre Zeitmessung neu, wenn man zurückkommt
  if(v==='learn'&&session&&session.cur&&!session.cur.answer)session.cur.shown=performance.now();
  view=v;
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===v));
  document.querySelectorAll('section.view').forEach(s=>s.hidden=s.id!=='v-'+v);
  ({learn:renderLearn,decks:renderDecks,overview:renderOverview,words:renderWords,data:renderData,algo:renderAlgo})[v]();
  try{localStorage.setItem(LS_KEY+'.view',v)}catch(e){}
}
document.addEventListener('click',e=>{
  // Deck-Übersicht auf dem Handy: Tipp auf den Statusbalken zeigt die Anzahlen, der nächste Tipp schließt sie wieder
  const openPop=document.querySelector('.deckcard.pop-open'),bar=e.target.closest('.dc-stack');
  if(bar&&matchMedia('(max-width:760px)').matches&&bar.closest('.deckcard').querySelector('.dc-pop')){
    const card=bar.closest('.deckcard'),was=card.classList.contains('pop-open');
    if(openPop)openPop.classList.remove('pop-open');if(!was)card.classList.add('pop-open');return;
  }
  if(openPop){openPop.classList.remove('pop-open');return}
  if(view==='learn'&&session&&session.cur&&session.cur.answer&&e.target.closest('#v-learn')&&!e.target.closest('[data-act="stop"],[data-view]'))return commit();
  const b=e.target.closest('button,[data-word],[data-close]');if(!b)return;
  const ds=b.dataset;
  if(ds.close&&(e.target===b||b.tagName==='BUTTON')){document.getElementById('overlay').innerHTML='';return}
  if(ds.view)return show(ds.view);
  if(ds.goto)return show(ds.goto);
  if(ds.opt!=null)return answer(+ds.opt);
  if(ds.dunno)return dunno();
  if(ds.lg)return lastGrade(ds.lg);
  if(ds.dir){db.settings.dirMode=ds.dir;save();session=null;return renderLearn()}
  if(ds.cal!=null){calSel=+ds.cal;return renderDecks()}
  if(ds.ov){db.settings.ovMode=ds.ov;save();return renderOverview()}
  if(ds.pick){db.active=ds.pick;session=null;save();renderDeckSel();return show('learn')}
  if(ds.filter){wordFilter=ds.filter;return renderWords()}
  if(ds.today){wordFilter=ds.today;wordSort.k='due';wordSort.dir=1;return show('words')}
  if(ds.sort){if(wordSort.k===ds.sort)wordSort.dir*=-1;else{wordSort.k=ds.sort;wordSort.dir=1}return renderWords()}
  if(ds.word&&!b.closest('.dialog'))return openWord(ds.word);
  if(ds.use){db.active=ds.use;session=null;save();renderDeckSel();return renderData()}
  if(ds.del||ds.reset){
    const id=ds.del||ds.reset,tag=(ds.del?'d':'r')+id;
    if(delArm!==tag){delArm=tag;renderData();setTimeout(()=>{if(delArm===tag){delArm=null;if(view==='data')renderData()}},4000);return}
    delArm=null;
    const dd=db.decks.find(d=>d.id===id);
    for(const k of Object.keys(db.cards))if(k.startsWith(id+'|'))delete db.cards[k];
    posCache=null;
    if(ds.del){db.decks=db.decks.filter(d=>d.id!==id);if(db.active===id)db.active=db.decks[0]?db.decks[0].id:null;save({delDeck:dd,settings:1});toast('Deck gelöscht')}
    else{save({resetDeck:dd});toast('Lernstand zurückgesetzt')}
    session=null;renderDeckSel();return renderData();
  }
  if(ds.shift!=null){const n=+ds.shift;db.settings.offset=n?(db.settings.offset||0)+n*DAY:0;session=null;save();toast(n?`Zeit um ${n} ${n===1?'Tag':'Tage'} vorgespult`:'Zurück auf heute');return renderData()}
  if(ds.simt){simTiming=ds.simt;return renderAlgo()}
  if(ds.sim){if(ds.sim==='reset')sim={c:null,t:0};else return simStep(+ds.sim);return renderAlgo()}
  switch(ds.act){
    case'start':return startSession(false);
    case'startReview':return startSession('review');
    case'next':return commit();
    case'stop':return stopLearning();
    case'import':return doImport();
    case'migrate':return migrateLocal();
    case'sample':return loadSampleDeck();
    case'cancelImport':pendingImport=null;return renderData();
    case'paste':{const v=document.getElementById('pasteIn').value;if(v.trim())prepImport(v,'Eingefügtes Deck');else toast('Das Textfeld ist leer.');return}
    case'cleanSim':{
      if(delArm!=='sim'){delArm='sim';renderOverview();setTimeout(()=>{if(delArm==='sim'){delArm=null;if(view==='overview')renderOverview()}},4000);return}
      delArm=null;const n=removeSimulated();toast(`${n} Karten bereinigt`);return renderOverview();
    }
    case'export':{const ta=document.getElementById('backup');ta.value=JSON.stringify(db);ta.select();
      if(navigator.clipboard)navigator.clipboard.writeText(ta.value).then(()=>toast('Sicherung kopiert'),()=>toast('Text ist markiert: mit Cmd/Strg+C kopieren'));else toast('Text ist markiert: mit Cmd/Strg+C kopieren');return}
    case'restore':{try{const o=JSON.parse(document.getElementById('backup').value);if(!o||!Array.isArray(o.decks)||!o.cards)throw 0;db={...freshDb(),...o,settings:{...freshDb().settings,...o.settings}};posCache=null;session=null;save({all:1});renderDeckSel();renderData();toast('Sicherung geladen')}catch(err){toast('Das ist keine gültige Sicherung.')}return}
  }
});
document.addEventListener('change',e=>{
  const id=e.target.id,p=pendingImport;
  if(id==='deckSel'){db.active=e.target.value;session=null;save();return show(view)}
  if(p&&['impA','impB','impT','impHdr','impName','impLA','impLB'].includes(id)){
    if(id==='impA')p.ca=+e.target.value;if(id==='impB')p.cb=+e.target.value;if(id==='impT')p.ct=+e.target.value;
    if(id==='impName')p.name=e.target.value.trim()||p.file;if(id==='impLA')p.la=e.target.value;if(id==='impLB')p.lb=e.target.value;
    if(id==='impHdr'){p.hasHeader=e.target.checked;if(!p.hasHeader){p.la='Sprache A';p.lb='Sprache B'}}
    if(id==='impA'&&p.hasHeader)p.la=p.rows[0][p.ca];if(id==='impB'&&p.hasHeader)p.lb=p.rows[0][p.cb];
    return renderData();
  }
  if(id==='setNew'){db.settings.newPer=clamp(+e.target.value||0,0,50);save()}
  if(id==='setNext'){db.settings.nextMode=e.target.value;save()}
  if(id==='setAfter'){db.settings.afterGoal=e.target.value;session=null;save()}
  if(id==='setSize'){db.settings.size=clamp(+e.target.value||20,5,100);save()}
  if(id==='setRet'){db.settings.retention=+e.target.value;save();rescheduleAll()}
});
document.addEventListener('input',e=>{
  if(e.target.id==='setRet')document.getElementById('retOut').textContent=Math.round(e.target.value*100)+' %';
  if(e.target.id==='wordSearch'){wordSearch=e.target.value;renderWords();const s=document.getElementById('wordSearch');s.focus();s.setSelectionRange(s.value.length,s.value.length)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&document.getElementById('overlay').innerHTML){document.getElementById('overlay').innerHTML='';return}
  if(view!=='learn'||!session||!session.cur||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName))return;
  const cur=session.cur;
  if(!cur.answer){if(/^[1-5]$/.test(e.key)){e.preventDefault();answer(+e.key-1)}else if(e.key==='0'){e.preventDefault();dunno()}return}
  if(e.key==='Enter'||e.key===' '){e.preventDefault();commit()}
});

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&session&&session.cur&&!session.cur.answer)session.cur.shown=performance.now();
});

/* ===================== Start ===================== */
// Bisherige Antworten einmalig nach der aktuellen Logik neu bewerten (Positions-Anker + Zeitgrenzen aus der Trefferquote)
// und jede betroffene Karte aus ihren echten Abfragezeitpunkten neu durchrechnen.
const REGRADE_VERSION=2;
function regradeAll(){
  posCache=null;const pm=posModel(),ret=db.settings.retention;let cards=0,grades=0;
  for(const k of Object.keys(db.cards)){
    const c=db.cards[k];
    if(!c||!c.reps||c.reps!==c.h.length)continue;   // gekürzter Verlauf: nicht neu rechnen
    const L=cardLen(k);let n=null,diff=0;const slips=(c.slips||[]).slice();
    c.h.forEach((e,i)=>{
      let g=e[1];
      if(e.length>=8&&e[7]===1){}   // von Hand bewertet: so lassen
      else if(e.length>=7&&e[5]<=IDLE_MS){
        const adj=pm.adjOf(e[5],e[6],L);
        if(g===1&&n&&n.reps&&adj<pm.slip){slips.push([e[0],e[5],e[6]]);diff++;return}   // früherer schneller Fehler = Vertipper
        if(g>1)g=adj>pm.slow?2:(adj<pm.fast&&n&&n.reps)?4:3;   // beim ersten Sehen höchstens „Gut“
      }else if(e.length>=7&&g>1)g=3;
      if(g!==e[1])diff++;
      n=applyReview(n,g,e[0],ret);
      n.h[n.h.length-1]=n.h[n.h.length-1].concat(e.slice(5));
    });
    if(diff&&n){if(slips.length)n.slips=slips.slice(-60);db.cards[k]=n;cards++;grades+=diff;const p=k.split('|');save({card:[p[0],p[1],p[2]]})}
  }
  posCache=null;
  return{cards,grades};
}
// Nach einer Änderung der Zielbehaltensrate: Fälligkeit jeder Karte aus ihrer Stabilität neu berechnen
function rescheduleAll(){
  const ret=db.settings.retention;let n=0;
  for(const k of Object.keys(db.cards)){
    const c=db.cards[k];if(!c||!c.reps||c.lastG===1)continue;
    const due=c.last+Math.max(1,Math.round(FSRS.interval(c.S,ret)))*DAY;
    if(due!==c.due){db.cards[k]={...c,due};n++;const p=k.split('|');save({card:[p[0],p[1],p[2]]})}
  }
  session=null;
  if(n)toast(`Termine von ${n} Karten an ${Math.round(ret*100)} % angepasst`);
}
function start(){
  db.settings={...freshDb().settings,...db.settings};
  if((db.settings.regraded||0)<REGRADE_VERSION&&Object.keys(db.cards).length){
    const r=regradeAll();db.settings.regraded=REGRADE_VERSION;save();
    if(r.grades)toast(`${r.grades} frühere Bewertungen bei ${r.cards} Karten neu berechnet`);
  }
  renderDeckSel();
  let v='learn';try{v=localStorage.getItem(LS_KEY+'.view')||'learn'}catch(e){}
  if(!document.getElementById('v-'+v))v='learn';
  if(deck())startSession(false);
  show(v);
}
async function boot(){
  const local=loadLocal(),validLocal=local&&Array.isArray(local.decks)&&local.decks.length?local:null;
  if(window.claude&&typeof window.claude.use==='function'){
    document.getElementById('v-learn').innerHTML='<div class="center-msg"><p class="muted">Lernstand wird geladen …</p></div>';
    let s=null;try{s=await window.claude.use('db')}catch(e){}
    if(s){
      try{
        const remote=await loadServer(s);
        srv=s;mode='server';
        if(remote)db=remote;else{db=freshDb();localOffer=validLocal}
        setSync('ok');start();return;
      }catch(e){console.warn('db',e);toast('Server nicht erreichbar. Der Lernstand wird vorerst nur in diesem Browser gespeichert.')}
    }
  }
  mode='local';db=validLocal;
  if(!db){db=freshDb();seedSample(false);saveLocal()}
  setSync('local');start();
}
boot();
</script>
