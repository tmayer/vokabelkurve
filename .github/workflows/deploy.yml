# Prüft die App bei jedem Push und spielt sie bei Änderungen auf main per SFTP nach IONOS.
# Benötigte Secrets (Settings → Secrets and variables → Actions):
#   IONOS_SFTP_HOST         z. B. access-1234567890.webspace-host.com
#   IONOS_SFTP_USER         SFTP-Benutzer aus dem IONOS-Kundenbereich
#   IONOS_SFTP_PASSWORD     zugehöriges Passwort
#   IONOS_TARGET_DIR        Zielordner auf dem Webspace, z. B. /tools/vocab
#   IONOS_KNOWN_HOSTS       Ausgabe von: ssh-keyscan -p 22 <IONOS_SFTP_HOST>
# Nie überschrieben oder gelöscht werden: api/config.php (Hash des Geräteschlüssels) und data/ (Lernstand).
name: Prüfen und deployen

on:
  push:
    branches: [main]
    paths: ['webspace/**', 'werkzeuge/decks_pruefen.py', '.github/workflows/deploy.yml']
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-ionos
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: PHP-Syntax
        run: for f in webspace/api/*.php; do php -l "$f"; done
      - name: Decks
        run: python3 werkzeuge/decks_pruefen.py webspace/decks

  deployen:
    needs: pruefen
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    environment: ionos
    steps:
      - uses: actions/checkout@v5
      - name: lftp installieren
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Hostschlüssel hinterlegen
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.IONOS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Hostschlüssel prüfen
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
        run: |
          # Zeigt nur Fingerabdrücke (nicht geheim), damit man sieht, ob Secret und Server zusammenpassen
          echo "Einträge im Secret: $(grep -cv '^#' ~/.ssh/known_hosts || true)"
          echo "Fingerabdrücke im Secret:"; ssh-keygen -lf ~/.ssh/known_hosts || true
          echo "Fingerabdrücke vom Server:"; ssh-keyscan -p 22 "$HOST" 2>/dev/null | ssh-keygen -lf - || true
          ssh-keygen -F "$HOST" >/dev/null || { echo "::error::IONOS_KNOWN_HOSTS enthält keinen Eintrag für den Hostnamen aus IONOS_SFTP_HOST. Mit ssh-keyscan für genau diesen Namen neu erzeugen."; exit 1; }
      - name: Per SFTP hochladen
        env:
          HOST: ${{ secrets.IONOS_SFTP_HOST }}
          USER: ${{ secrets.IONOS_SFTP_USER }}
          LFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          DIR: ${{ secrets.IONOS_TARGET_DIR }}
        run: |
          # 1) App ohne Löschen spiegeln; config.php und data/ bleiben unberührt
          # 2) decks/ mit Löschen spiegeln, damit entfernte Decks auch auf dem Server verschwinden
          lftp --env-password -u "$USER" "sftp://$HOST" -e "
            set sftp:auto-confirm no;
            set net:max-retries 2;
            mirror --reverse --verbose \
              --exclude-glob .DS_Store --exclude ^api/config\.php$ --exclude ^data/ \
              webspace/ '$DIR/';
            mirror --reverse --verbose --delete \
              --exclude-glob .DS_Store \
              webspace/decks/ '$DIR/decks/';
            quit"
